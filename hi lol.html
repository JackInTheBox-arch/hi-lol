<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Important Question 👀</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    position: relative;
    width: 320px;
  }

  h1 {
    color: #ff4d6d;
    margin-bottom: 30px;
  }

  button {
    font-size: 18px;
    padding: 12px 22px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
  }

  #yes {
    background: #ff4d6d;
    color: white;
    margin-right: 10px;
  }

  #no {
    background: #ddd;
    color: #555;
    position: absolute;
  }

  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background: red;
    top: -10px;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(720deg);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="question">Will you be my Valentine? 💖</h1>
  <button id="yes">YES!1!11!!111!11</button>
  <button id="no">Hell naw</button>
</div>

<audio id="boom" src="https://www.myinstants.com/media/sounds/vine-boom.mp3"></audio>

<script>
  const noBtn = document.getElementById("no");
  const card = document.getElementById("card");
  const yesBtn = document.getElementById("yes");
  const question = document.getElementById("question");
  const boom = document.getElementById("boom");

  let stage = 0;

  function moveButton() {
    const rect = card.getBoundingClientRect();
    const x = Math.random() * (rect.width - noBtn.offsetWidth);
    const y = Math.random() * (rect.height - noBtn.offsetHeight);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  noBtn.addEventListener("mouseenter", moveButton);
  noBtn.addEventListener("touchstart", e => {
    e.preventDefault();
    moveButton();
  });

  yesBtn.onclick = () => {
    boom.play();

    stage++;
    if (stage === 1) {
      question.innerText = "Are you REALLY sure? 🤨";
    } else if (stage === 2) {
      question.innerText = "Like… 100% sure?? 😳";
    } else {
      launchConfetti();
      document.body.innerHTML = `
        <h1 style="color:white;font-family:Arial;text-align:center;margin-top:40vh;">
          LET’S GOOOO 💘🥹✨
        </h1>
      `;
    }
  };

  function launchConfetti() {
    for (let i = 0; i < 120; i++) {
      const conf = document.createElement("div");
      conf.className = "confetti";
      conf.style.left = Math.random() * 100 + "vw";
      conf.style.background = `hsl(${Math.random()*360},100%,60%)`;
      conf.style.animationDuration = (Math.random() * 2 + 1) + "s";
      document.body.appendChild(conf);
    }
  }
</script>

</body>
</html>
